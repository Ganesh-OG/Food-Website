<div style="margin:0; padding:0; background:#f4f4f4; font-family:Arial, Helvetica, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f4; padding:24px 0;">
    <tr>
      <td align="center">
        <table width="520" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 4px 18px rgba(0,0,0,0.08);">
          <tr>
            <td style="background:#111111; padding:0; text-align:center;">
              <img
                src="https://plojfgqvvojpushcatsn.supabase.co/storage/v1/object/public/Food-Website-Storage/Email%20Header%20Image/Dr%20NGP%20Logo.png"
                alt="Header"
                style="display:block; width:100%; max-width:520px; height:auto; border:0;"
              />
            </td>
          </tr>

          <tr>
            <td style="padding:32px 32px 16px 32px; text-align:center;">
              <h2 style="margin:0; font-size:28px; color:#111111;">Email Verification</h2>
              <p style="margin:14px 0 0 0; font-size:16px; color:#555555; line-height:1.6;">
                Hello {{name}}, use the verification code below to continue your registration.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:8px 32px 8px 32px; text-align:center;">
              <div style="display:inline-block; background:#f7f7f7; border:1px solid #e3e3e3; border-radius:10px; padding:18px 28px; font-size:32px; font-weight:bold; letter-spacing:8px; color:#111111;">
                {{otp}}
              </div>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 32px 8px 32px; text-align:center;">
              <p style="margin:0; font-size:14px; color:#666666; line-height:1.7;">
                This OTP is valid only for 60 seconds. If you did not request this, please ignore this email.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 32px 32px 32px; text-align:center;">
              <p style="margin:0; font-size:13px; color:#888888;">
                This is an automated email from your canteen portal.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
