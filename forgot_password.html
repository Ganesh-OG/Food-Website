<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Forgot Password - Food Website</title>

   <link rel="shortcut icon" href="images/ngplogo.jpg">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
   <link rel="stylesheet" href="css/style.css">
   <link rel="stylesheet" href="css/login.css">
</head>

<body style="display:flex; flex-direction:column; min-height:100vh;">
   <main class="flex-grow">
      <div class="login-container">
         <div class="login-box" id="formBox">
            <img src="images/ngplogo.jpg" alt="Logo" class="login-logo">
            <h2>Reset Password</h2>
            <p class="login-subtitle">Use OTP verification to securely set a new password.</p>

            <div id="forgotPasswordSection" class="otp-section" style="display:block;">
               <p class="otp-title">Reset Password</p>
               <p class="otp-subtitle">Enter your registered email to receive an OTP.</p>

               <div class="form-group">
                  <input type="email" id="resetEmail" placeholder="Registered Email">
               </div>

               <button type="button" class="btn-login" id="sendResetOtpBtn">Send OTP</button>
            </div>

            <div id="resetOtpSection" class="otp-section" style="display:none;">
               <p class="otp-title">Verify Reset OTP</p>
               <p class="otp-subtitle">Enter the OTP sent to <span id="resetOtpEmailPreview"></span></p>

               <div class="form-group">
                  <input type="text" id="resetOtpCode" placeholder="Enter OTP" inputmode="numeric" maxlength="6">
               </div>

               <div class="otp-actions">
                  <button type="button" class="btn-login" id="verifyResetOtpBtn">Verify OTP</button>
                  <button type="button" class="guest-link-btn secondary otp-secondary-btn" id="resendResetOtpBtn">Resend OTP</button>
               </div>
            </div>

            <div id="resetPasswordSection" class="otp-section" style="display:none;">
               <p class="otp-title">Create New Password</p>
               <p class="otp-subtitle">OTP verified. Set your new password.</p>

               <div class="form-group">
                  <input type="password" id="resetNewPassword" placeholder="New Password">
                  <i class="fas fa-eye-slash" id="resetPasswordEyeIcon"></i>
               </div>

               <div class="form-group">
                  <input type="password" id="resetConfirmPassword" placeholder="Confirm New Password">
                  <i class="fas fa-eye-slash" id="resetConfirmPasswordEyeIcon"></i>
               </div>

               <button type="button" class="btn-login" id="completeResetBtn">Update Password</button>
            </div>

            <p class="guest-links-label">External or new user?</p>
            <div class="guest-links guest-links-actions">
               <a href="signin.html" class="guest-link-btn primary">Login</a>
               <a href="register.html" class="guest-link-btn secondary">Register</a>
               <a href="index.html" class="guest-link-btn secondary">Continue Shopping</a>
            </div>
         </div>
      </div>
   </main>

   <div id="errorPopup">
      <span id="popupMessage"></span>
      <button id="closeBtn" style="background: none; border: none; float: right; cursor: pointer; font-size: 1.2rem;">&times;</button>
   </div>

   <script type="module" src="js/script.js"></script>
   <script type="module" src="components/JS/forgot_password.js"></script>
</body>
</html>
