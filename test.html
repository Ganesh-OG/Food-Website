<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#111;
            color:white;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .box{
            background:#1e1e1e;
            padding:30px;
            border-radius:12px;
            width:350px;
            text-align:center;
        }

        h2{
            margin-bottom:20px;
        }

        input{
            margin-bottom:20px;
            width:100%;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            background:#00b894;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#019875;
        }

        #status{
            margin-top:15px;
        }

        img{
            width:100px;
            height:100px;
            object-fit:contain;
            margin-bottom:15px;
            display:none;
            background:white;
            border-radius:8px;
            padding:5px;
        }

    </style>

</head>
<body>

    <div class="box">

        <h2>Upload Logo</h2>

        <img id="preview">

        <input type="file" id="fileInput" accept="image/*">

        <button onclick="uploadImage()">
            Upload Image
        </button>

        <p id="status"></p>

    </div>



    <!-- CONFIG -->
    <script src="config.js"></script>

    <!-- MAIN SCRIPT -->
    <script>

        const fileInput = document.getElementById("fileInput");

        const preview = document.getElementById("preview");

        const statusText = document.getElementById("status");



        fileInput.addEventListener("change", () => {

            const file = fileInput.files[0];

            if(file){

                preview.src = URL.createObjectURL(file);

                preview.style.display = "block";
            }
        });




        async function uploadImage(){

            const file = fileInput.files[0];

            if(!file){

                statusText.innerText = "Select an image.";

                statusText.style.color = "red";

                return;
            }



            statusText.innerText = "Uploading...";

            statusText.style.color = "#00ff99";



            const reader = new FileReader();



            reader.onload = async function(){

                const base64Data = reader.result.split(",")[1];

                const fileName = file.name;



                const url =
                `https://api.github.com/repos/${GITHUB_CONFIG.USERNAME}/${GITHUB_CONFIG.REPO}/contents/${GITHUB_CONFIG.FOLDER_PATH}/${fileName}`;



                try{

                    const response = await fetch(url, {

                        method: "PUT",

                        headers: {

                            "Authorization":
                            `token ${GITHUB_CONFIG.TOKEN}`,

                            "Content-Type":
                            "application/json"
                        },

                        body: JSON.stringify({

                            message: `Uploaded ${fileName}`,

                            content: base64Data
                        })
                    });



                    const data = await response.json();



                    if(response.ok){

                        statusText.innerHTML =
                        `
                        Upload Successful!
                        <br><br>

                        <a
                            href="${data.content.html_url}"
                            target="_blank"
                            style="color:#00ff99;"
                        >
                            View Image
                        </a>
                        `;

                    }else{

                        console.log(data);

                        statusText.innerText =
                        data.message || "Upload failed.";

                        statusText.style.color = "red";
                    }

                }catch(error){

                    console.error(error);

                    statusText.innerText =
                    "Error uploading image.";

                    statusText.style.color = "red";
                }
            };

            reader.readAsDataURL(file);
        }

    </script>

</body>
</html>
