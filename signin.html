<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Sign In - Food Website</title>

   <link rel="shortcut icon" href="images/ngplogo.jpg">
   <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css"/>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
   <link rel="stylesheet" href="css/style.css">
   <link rel="stylesheet" href="css/login.css">
</head>

<body style="display:flex; flex-direction:column; min-height:100vh;">
   <script>
      const existingUser = JSON.parse(localStorage.getItem("user"));
      const existingPowers = JSON.parse(localStorage.getItem("powers") || "[]");
      if (existingUser) {
         const role = String(existingUser.role || "").trim().toLowerCase();
         const isAdminUser = ["admin", "manager", "sales staff", "billing staff", "custom role"].includes(role) || existingPowers.length > 0;
         const redirectTarget = isAdminUser
            ? "admin/select-mode.html"
            : (new URLSearchParams(window.location.search).get("redirect") || "index.html");
         window.location.replace(redirectTarget);
      }
   </script>
   <main class="flex-grow">
      <div class="login-container">
         <div class="login-box" id="formBox">
            <img src="images/ngplogo.jpg" alt="Logo" class="login-logo">
            <h2>Welcome Back</h2>
            <p class="login-subtitle">Sign in when you're ready to place your order.</p>

            <form id="loginForm">
               <div class="form-group">
                  <input type="text" id="loginInput" placeholder="Email or ID" required>
               </div>
               <div class="form-group">
                  <input type="password" id="password" placeholder="Password" required>
                  <i class="fas fa-eye-slash" id="eyeIcon"></i>
               </div>
               <button type="submit" class="btn-login">Login</button>
            </form>

            <p class="guest-links-label">External or new user?</p>
            <div class="guest-links guest-links-actions">
               <a href="register.html" class="guest-link-btn primary">Register</a>
               <a href="forgot_password.html" class="guest-link-btn secondary" id="forgotPasswordTrigger">Forgot Password</a>
               <a href="index.html" class="guest-link-btn secondary">Continue Shopping</a>
            </div>
         </div>
      </div>
   </main>

   <div id="errorPopup">
      <span id="popupMessage"></span>
      <button id="closeBtn" style="background: none; border: none; float: right; cursor: pointer; font-size: 1.2rem;">&times;</button>
   </div>

   <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
   <script type="module" src="js/script.js"></script>
   <script type="module" src="components/JS/login.js"></script>
</body>
</html>
