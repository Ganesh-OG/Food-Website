<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Profile</title>

   <link rel="shortcut icon" href="images/ngplogo.jpg">
   <link rel="stylesheet" href="css/style.css">
   <link rel="stylesheet" href="css/profile.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>

<body>

<!-- 🔥 HEADER -->
<div id="headerContainer"></div>

<div class="heading">
   <h3>PROFILE</h3>
   <p><a href="index.html">HOME</a> / PROFILE</p>
</div>

<section class="user-details">
   <div class="user">

      <img src="images/user-icon.png" alt="User icon">

      <p><i class="fas fa-user"></i> <span id="name"></span></p>
      <p><i class="fas fa-envelope"></i> <span id="email"></span></p>
      <p><i class="fas fa-building"></i> <span id="department"></span></p>
      <p><i class="fas fa-id-badge"></i> <span id="id"></span></p>
      <p><i class="fas fa-calendar-alt"></i> <span id="dob"></span></p>
      <p><i class="fas fa-wallet"></i> <span id="balance"></span></p>

      <form action="password_reset.html" class="profile-password-form">
         <input type="submit" value="Update Password" class="custom-btn">
      </form>

   </div>
</section>

<!-- 🔥 FOOTER -->
<div id="footerContainer"></div>

<!-- MODULES -->
<script type="module" src="js/script.js"></script>
<script type="module" src="components/JS/profile.js"></script>
<script type="module" src="components/JS/user_header.js"></script>
<script type="module" src="components/JS/footer.js"></script>

</body>
</html>
